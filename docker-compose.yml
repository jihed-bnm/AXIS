services:

  # ── 1. Database — starts first, everything depends on it ──────────────────
  axis-db:
    image: postgres:16
    container_name: axis-db
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── 2a. Vector store — starts in parallel with axis-ollama after db ────────
  # Note: the backend currently uses chromadb.PersistentClient (local file store
  # at ./chroma_db inside the backend container). axis-chromadb provides an HTTP
  # API for external tooling and future migration to HttpClient.
  axis-chromadb:
    image: chromadb/chroma:0.4.24
    container_name: axis-chromadb
    environment:
      CHROMA_SERVER_HTTP_PORT: "8001"
      IS_PERSISTENT: "1"
      CHROMA_PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "false"
    expose:
      - "8001"
    volumes:
      - chroma-data:/chroma/chroma
    depends_on:
      axis-db:
        condition: service_healthy
    restart: unless-stopped

  # ── 2b. LLM runtime — starts in parallel with axis-chromadb after db ───────
  axis-ollama:
    image: ollama/ollama:latest
    container_name: axis-ollama
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      axis-db:
        condition: service_healthy
    restart: unless-stopped

  # ── 3. Backend — waits for db (healthy), chromadb and ollama (started) ─────
  axis-backend:
    build:
      context:    .
      dockerfile: Dockerfile
    container_name: axis-backend
    env_file:
      - .env
    environment:
      # Override localhost URLs from .env with Docker-internal service names
      DATABASE_URL:    postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@axis-db:5432/${POSTGRES_DB}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      CHROMADB_URL:    ${CHROMADB_URL}
    expose:
      - "8000"
    volumes:
      - backend-logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      axis-db:
        condition: service_healthy
      axis-chromadb:
        condition: service_started
      axis-ollama:
        condition: service_started
    restart: unless-stopped

  # ── 4. Frontend — only external entry point, waits for backend healthy ─────
  axis-frontend:
    build:
      context:    .
      dockerfile: frontend/Dockerfile
    container_name: axis-frontend
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      axis-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  chroma-data:
  ollama-models:
  backend-logs:
